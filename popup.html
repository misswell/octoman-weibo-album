<!DOCTYPE html>
<html>
<head>
    <title>Octo Weibo Album</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
    <link rel="stylesheet" type="text/css" href="popup.css"/>
    <script type="text/javascript" src="jquery/jquery-3.4.1.js"></script>
    <script type="text/javascript" src="popup.js"></script>
</head>
<body>
<main id="login_suc" class="popup-shell">
    <header class="popup-header">
        <div>
            <h1>微博相册下载</h1>
            <div class="name" hidden>正在识别当前页面</div>
        </div>
        <a href="#" id="author" class="feedback-link">反馈</a>
    </header>

    <section class="notice">
        <button type="button" class="warning-toggle" aria-expanded="false">注意事项</button>
        <div class="warning-more">
            <p>关闭 Chrome 的“下载前询问每个文件的保存位置”。</p>
            <p>保持微博登录状态，否则无法获取相册详情。</p>
            <p>下载数量不一致通常是照片被删除或设置了隐藏。</p>
        </div>
    </section>

    <section class="toolbar select-position" hidden>
        <label class="field">
            <span>账号</span>
            <span class="user-list"></span>
        </label>
        <label class="field compact">
            <span>比例</span>
            <select name="" id="ratio">
                <option value="1">100%</option>
                <option value="0.5">50%</option>
                <option value="0.25">25%</option>
                <option value="0.10">10%</option>
                <option value="0.05">5%</option>
                <option value="0.02">2%</option>
                <option value="0.01">1%</option>
            </select>
        </label>
        <label class="field compact">
            <span>并发</span>
            <select name="" id="con-current">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="10">10</option>
            </select>
        </label>
    </section>

    <section class="album-loading">
        <img src="/img/loading.gif" alt="">
        <span>正在读取相册</span>
    </section>

    <section class="album-list"></section>

    <section class="settings-row">
        <label class="toggle">
            <input type="checkbox" id="open-folder" checked>
            <span>完成后打开文件夹</span>
        </label>
        <div class="actions">
            <input type="button" id="down-pause" value="暂停">
            <input type="button" id="down-cancel" value="停止" disabled>
        </div>
    </section>

    <section class="process"></section>
</main>
</body>
</html>
